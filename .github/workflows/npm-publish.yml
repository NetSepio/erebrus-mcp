name: npm publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @netsepio/erebrus-mcp
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck + build
        run: |
          npm run typecheck
          npm run build

      - name: Publish
        run: npm publish --access public
        env:
          # Prefer classic token until trusted publishing is configured on npm
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
